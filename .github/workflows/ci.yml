name: Check pull requests and main

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Optional browser tests
        type: choice
        default: none
        options:
          - none
          - full
          - performance

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Run calculation and data tests
        run: |
          npm test
          npm run test:app
          npm run test:deployment

      - name: Build the website
        run: npm run build

      - name: Install Chromium
        if: github.event_name == 'workflow_dispatch' && inputs.browser_tests != 'none'
        run: npx playwright install --with-deps chromium

      - name: Run full browser suite (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_tests == 'full'
        run: npm run test:browser

      - name: Run performance tests (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_tests == 'performance'
        run: npm run test:browser:performance

      - name: Upload browser test report and failure traces
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.browser_tests != 'none' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
